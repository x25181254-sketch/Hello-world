
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hello World</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f4f6f9;
      font-family: Arial, sans-serif;
    }

    .card {
      text-align: center;
      background: white;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 4px 20px #0001;
    }

    h1 { color: #333; }

    button {
      padding: 12px 24px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    button:hover { background: #1d4ed8; }
  </style>
</head>
<body>
  <div class="card">
    <h1 id="message">Hello World! 👋</h1>
    <p>My first webpage</p>
    <button onclick="changeText()">Click Me</button>
  </div>

  <script>
    function changeText() {
      document.getElementById("message")
        .textContent = "Hello from JavaScript! 🚀";
    }
  </script>
</body>
</html>
